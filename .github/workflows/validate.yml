name: Validate Harness & Scripts

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Cache LibreOffice apt packages
        id: cache-apt
        uses: actions/cache@v4
        with:
          path: ~/.cache/apt-archives
          key: apt-libreoffice-${{ runner.os }}-${{ hashFiles('.github/workflows/validate.yml') }}

      - name: Install LibreOffice Calc (headless)
        run: |
          mkdir -p ~/.cache/apt-archives
          if compgen -G "$HOME/.cache/apt-archives/*.deb" > /dev/null; then
            sudo cp -n "$HOME/.cache/apt-archives/"*.deb /var/cache/apt/archives/
          fi
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            -o APT::Keep-Downloaded-Packages=true \
            libreoffice-calc-nogui
          if [ "${{ steps.cache-apt.outputs.cache-hit }}" != "true" ]; then
            sudo cp -n /var/cache/apt/archives/*.deb "$HOME/.cache/apt-archives/" || true
            sudo chown -R "$(id -u):$(id -g)" "$HOME/.cache/apt-archives"
          fi
          soffice --version

      - name: Install Python test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install openpyxl pyyaml

      - name: Validate harness structure & frontmatter
        run: python3 scripts/validate_harness.py

      - name: Run unit & LibreOffice integration tests
        env:
          REQUIRE_FULL_TEST_SUITE: "1"
        run: python3 -m unittest discover -s tests -v
