name: Validate Harness & Scripts

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install LibreOffice Calc (headless)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libreoffice-calc-nogui

      - name: Install Python test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install openpyxl pyyaml

      - name: Validate harness structure & frontmatter
        run: python3 scripts/validate_harness.py

      - name: Run unit & LibreOffice integration tests
        run: python3 -m unittest discover -s tests -v
